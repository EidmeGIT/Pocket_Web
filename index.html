  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color:red;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Master Container */
    .browser-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      max-height: 932px;
      overflow: hidden;
      background-color: white;
      position: relative;
    }

    /* Top Drag Action Overlay Zone */
    .drag-action-zone {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 120px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: visible;
    }

    /* Action Icons Container */
    .action-icons-container {
      position: relative;
      width: 100%;
      max-width: 320px;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Base Icon Item */
    .action-icon-item {
      position: absolute;
      top: -15px;
      left: 50%;
      margin-left: -22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      color: #1c1c1e;
      font-size: 26px;
      opacity: 0;
      transform: translate3d(0, 0px, 0) scale(1);
      will-change: transform, opacity;
      z-index: 20;
    }

    .action-icon-item i {
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .action-icon-item.center-icon {
      z-index: 25;
    }

    /* Center Reload Dark Circle Background - Nested Inside Center Icon */
    .reload-circle-bg {
      position: absolute;
      top: -8px;
      left: -8px;
      width: 60px;
      height: 60px;
      background-color: #e3e2e1;
      border-radius: 50%;
      z-index: 1;
      transform: scale(0);
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
      pointer-events: none;
      will-change: transform, opacity;
      transform-origin: center center;
    }

    /* Center Reload Label Text */
    .reload-label-text {
      position: absolute;
      bottom: -30px;
      font-size: 12px;
      font-weight: 500;
      color: #8e8e93;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      z-index: 3;
    }

    .reload-label-text.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Release Expanding Circle Fade Overlay */
    .release-expand-circle {
      position: absolute;
      top: -1px;
      left: -1px;
      width: 46px;
      height: 46px;
      background-color: #e3e2e1;
      border-radius: 50%;
      z-index: 0;
      opacity: 0;
      transform: scale(var(--start-scale, 1));
      pointer-events: none;
      will-change: transform, opacity;
      transform-origin: center center;
    }

    .release-expand-circle.animating {
      animation: expandFadeOut 0.85s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* Keyframe now starts directly from current scale size */
    @keyframes expandFadeOut {
      0% {
        transform: scale(var(--start-scale, 1));
        opacity: 1;
      }
      100% {
        transform: scale(14);
        opacity: 1;
      }
    }

    /* Header Area */
    .browser-header {
      width: 100%;
      height: 52px;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 6px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      flex-shrink: 0;
      z-index: 30;
      will-change: transform, opacity;
      cursor: grab;
      position: relative;
    }

    .browser-header:active {
      cursor: grabbing;
    }

    /* Blue Bottom Border Progress Line */
    .header-progress-bar {
      position: absolute;
      bottom: -2px;
      left: 0;
      height: 3px;
      width: 0%;
      background-color: #007aff;
      z-index: 35;
      opacity: 0;
      pointer-events: none;
      border-radius: 0 2px 2px 0;
      will-change: width, opacity;
    }

    .url-bar-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 34px;
      padding: 0 16px;
      background-color: #e9ecef;
      border-radius: 22px;
    }

    .url-icon-btn {
      color: #6c757d;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .url-text-display {
      font-size: 17px;
      color: #212529;
      font-weight: 400;
      letter-spacing: -0.2px;
      text-align: center;
      flex: 1;
      padding: 0 10px;
      font-family:-apple-system ;
    }

    /* Viewport Area */
    .browser-viewport {
      flex: 1 1 auto;
      width: 100% !important;
      height: 100% !important;
      min-height: 0 !important;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden !important;
      z-index: 20;
      will-change: transform;
    }

    /* SVG Overlay Styling */
    .svg-overlay-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
    }

    .svg-overlay-container.active {
      opacity: 1;
    }

    .browser-content-slot {
      width: 100% !important;
      height: 100% !important;
      display: block;
      border: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .hosted-app-iframe {
      width: 100% !important;
      height: 100% !important;
      border:1px solid #202021;
      outline: none !important;
      display: block !important;
    }

    /* Footer Toolbar Area */
    .browser-footer {
      width: 100%;
      height: 76px;
      background-color: #ffffff;
      display: flex;
      margin-top:2px;
      justify-content: space-between;
      padding: 0 4px;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      flex-shrink: 0;
      z-index: 100;
      position: relative;
    }

    .toolbar-btn {
      background: none;
      border: none;
      color: rgba(0,0,0,0.5);
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      outline: none;
    }

    .toolbar-btn.disabled {
      color: rgba(0,0,0,0.2);
      cursor: default;
    }

    .add-tab-btn {
      background-color: #e9ecef;
      color: rgba(0,0,0,0.4);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 24px;
    }

    .tab-counter-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 25px;
      height: 25px;
      border: 2px solid #5f6368;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      color: #5f6368; 
      line-height: 1;
    }

    .toolbar-btn.disabled .tab-counter-box {
      border-color: #d1d5db;
      color: #d1d5db;
    }
  </style>
</head>

.pro-mode-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid #949be0;
  border-radius: 13px;
  color: white;
  padding: 3px;
  min-width: 82px;
  cursor: pointer;
  font-family: sans-serif;
  font-weight: bold;
  position: relative;
  left: 0px;
  top: -7px;
  overflow: hidden;
  font-family:'Noto Sans';
  transition: transform 0.25s ease,
              filter 0.25s ease,
              box-shadow 0.25s ease;
}

.pro-mode-btn::before,
.pro-mode-btn::after {
    content: "";
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    background-repeat: no-repeat;
    background-size: contain;
    pointer-events: none;

    /* Initial state */
    transform: scale(1);
    filter: brightness(0.95);
    transition: transform .25s ease, filter .25s ease;
}

.pro-mode-btn::before {
    top: 0;
    background-image: url("https://pocketoption.com/themes/cabinet/images/trading-modes/pro-top-dark-blue.png?v=3");
    background-position: top center;
    transform-origin: top center;
}

.pro-mode-btn::after {
    bottom: 0;
    background-image: url("https://pocketoption.com/themes/cabinet/images/trading-modes/pro-bottom-dark-blue.png?v=3");
    background-position: bottom center;
    transform-origin: bottom center;
}

/* Hover: only images animate */
.pro-mode-btn:hover::before,
.pro-mode-btn:hover::after {
    transform: scale(1.15);
    filter: brightness(1.05);
}
/* Click */
.pro-mode-btn:active {
  transform: scale(0.98);
}
.pro-mode-btn .icon {
  font-size: 24px;
}

    <script>
        let currentPageTools = 'Trading'; 
        let lastPrimaryPageTools = 'Trading'; 
        const secondaryMenuTools = document.getElementById('secondary-menu-tools');
        const contentAreaTools = document.getElementById('content-area'); 

        const updateSidebarActiveStateTools = (activePages) => {
            const navItems = document.querySelectorAll('.nav-item-tools');
            navItems.forEach(item => {
                const page = item.getAttribute('data-page-tools');
                item.classList.remove('nav-item-active-tools');
                if (activePages.includes(page)) {
                    item.classList.add('nav-item-active-tools');
                }
            });
        };

        const renderContentTools = (page) => {
            if (contentAreaTools) {
                contentAreaTools.innerHTML = ''; 
            }
        };

        const navigateToTools = (pageName, event) => {
            if (event) event.preventDefault();
            
            if (pageName === 'Finance') {
                const isMenuVisible = !secondaryMenuTools.classList.contains('hidden');
                if (isMenuVisible) {
                    secondaryMenuTools.classList.add('hidden');
                    currentPageTools = lastPrimaryPageTools;
                } else {
                    secondaryMenuTools.classList.remove('hidden');
                }
            } else {
                secondaryMenuTools.classList.add('hidden');
                currentPageTools = pageName;
                lastPrimaryPageTools = pageName;
            }
            
            renderContentTools(currentPageTools); 
            
            if (!secondaryMenuTools.classList.contains('hidden')) {
                updateSidebarActiveStateTools([lastPrimaryPageTools, 'Finance']);
            } else {
                updateSidebarActiveStateTools([currentPageTools]);
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const navItems = document.querySelectorAll('.nav-item-tools');
            navItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    const page = item.getAttribute('data-page-tools');
                    navigateToTools(page, e);
                });
            });
            navigateToTools(currentPageTools);
        });
    </script>

    // --- Integration Logic ---
    function initWithdrawalPageLogic() {
        // ... (All constants, helper functions, and element getters remain the same)
        const MOCK_EMAIL = 'user-email@example.com';
        const MIN_WITHDRAWAL_RULES = { 'btc': 100, 'usdt_trc20': 50, 'base_usdc':10 };
        const NETWORK_DELAY_MS = Math.floor(Math.random() * (200 - 100 + 1)) + 100;
        const BUTTON_LOADING_DELAY_MS = Math.floor(Math.random() * (2000 - 500 + 1)) + 500;
        const CONFIRMATION_LOAD_DELAY_MS = Math.floor(Math.random() * (2000 - 500 + 1)) + 500;
        const BADGE_POP_DELAY_MS = Math.floor(Math.random() * (500 - 300 + 1)) + 300;
        const FORMAT_OPTIONS = { minimumFractionDigits: 0, maximumFractionDigits: 2 };
        
        // Get Elements scoped to the wrapper
        const wrapper = document.getElementById('withdrawal-view-container');
        const selectHeader = wrapper.querySelector('#select-header');
        const selectOptions = wrapper.querySelector('#select-options');
        const selectedValueSpan = wrapper.querySelector('#selected-value');
        const hiddenInput = wrapper.querySelector('#payment-method');
        const freeBalanceElement = wrapper.querySelector('#free-balance-value');
        const minWithdrawalElement = wrapper.querySelector('#min-withdrawal-value');
        const addressLabel = wrapper.querySelector('label[for="address"]');
        const amountInput = wrapper.querySelector('#amount');
        const safeCard = wrapper.querySelector('#safe-card');
        const topUpSafeButton = wrapper.querySelector('#top-up-safe-button');
        const loaderOverlay = wrapper.querySelector('#loader-overlay');
        const confirmationContentLoader = wrapper.querySelector('#confirmation-content-loader');
        const withdrawalCard = wrapper.querySelector('#withdrawal-card');
        const confirmationCard = wrapper.querySelector('#confirmation-card');
        const successCard = wrapper.querySelector('#success-card');
        const continueButton = wrapper.querySelector('#continue-button'); 
        const continueLoader = wrapper.querySelector('#continue-loader');
        const confirmPinButton = wrapper.querySelector('#confirm-pin-button');
        const confirmLoader = wrapper.querySelector('#confirm-loader-status');
        const mainContentTitle = wrapper.querySelector('#main-content-title');
        const pinMessageElement = wrapper.querySelector('#pin-confirmation-message');
        const historyBadge = wrapper.querySelectorAll('.history-notification-badge');
	

        function simulateNetworkCall(delay) {
            // Clamping the delay to ensure it stays within reasonable bounds
            const finalDelay = Math.min(Math.max(delay, 200), 50000); 
            return new Promise(resolve => setTimeout(resolve, finalDelay));
        }

        function setFormLoaderActive(isActive) {
            if (loaderOverlay) {
                if (isActive) {
                    loaderOverlay.classList.add('active');
                } else {
                    // Small delay to ensure CSS transition completes when hiding
                    setTimeout(() => { loaderOverlay.classList.remove('active'); }, 50); 
                }
            }
        }
        
        function setConfirmationContentLoaderActive(isActive) {
             if (confirmationContentLoader) {
                if (isActive) {
                    confirmationContentLoader.classList.add('show');
                } else {
                    setTimeout(() => { confirmationContentLoader.classList.remove('show'); }, 50); 
                }
            }
        }

        function setButtonLoaderActive(button, loader, isActive) {
            if (button && loader) {
                if (isActive) {
                    button.disabled = true;
                    button.classList.add('loading-active');
                    loader.classList.add('show');
                } else {
                    button.disabled = false;
                    button.classList.remove('loading-active');
                    loader.classList.remove('show');
                }
            }
        }

        function updateMinWithdrawal(currencyCode) {
            const minAmount = MIN_WITHDRAWAL_RULES[currencyCode] !== undefined ? MIN_WITHDRAWAL_RULES[currencyCode] : 0; 
            minWithdrawalElement.textContent = `$${minAmount.toLocaleString(undefined, FORMAT_OPTIONS)}`;
        }

        function updateAddressLabel(selectedText) {
            if (addressLabel) addressLabel.textContent = `${selectedText} address:`;
        }
        
        function getRawAmount(value) {
            return parseFloat(String(value).replace(/[^0-9.]/g, '')) || 0;
        }

        const historyBadges = document.querySelectorAll('.history-notification-badge');



function animateBadgeCount() {
    const target = 1;
    const duration = 600;
    const stepTime = 20;
    const steps = duration / stepTime;
    const increment = target / steps;

    historyBadges.forEach((badge) => {
        let count = 0;

        function updateCount() {
            if (count < target) {
                count += increment;
                badge.textContent = Math.min(Math.round(count), target);
                setTimeout(updateCount, stepTime);
            } else {
                badge.textContent = target;
            }
        }

        badge.textContent = 0; // start from 0
        badge.classList.add('show');
        updateCount();
    });
}


        // --- Logic synced with Parent Global `realBalance` ---
        if (typeof realBalance === 'undefined') {
            console.error("Parent 'realBalance' not found. Withdrawal module requires parent context.");
            return;
        }

        // Initial Setup
        if (freeBalanceElement) {
            freeBalanceElement.textContent = `$${realBalance.toLocaleString(undefined, FORMAT_OPTIONS)}`;
        }
        if (hiddenInput && minWithdrawalElement) {
            updateMinWithdrawal(hiddenInput.value);
        }

        // --- Event Listeners ---
        if (wrapper.dataset.listenersAttached === "true") {
            if (freeBalanceElement) freeBalanceElement.textContent = `$${realBalance.toLocaleString(undefined, FORMAT_OPTIONS)}`;
            return; 
        }
        wrapper.dataset.listenersAttached = "true";

        if (amountInput) {
            amountInput.addEventListener('input', () => {
                const rawValue = amountInput.value.replace(/[^0-9.]/g, '');
                const amount = parseFloat(rawValue);
                const isAmountValid = amount >= 1;
                
                let formattedAmount = '';
                if (isAmountValid) {
                    if (rawValue.endsWith('.')) {
                        formattedAmount = amount.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + '.';
                    } else if (rawValue.includes('.') && rawValue.split('.')[1].length > 2) {
                        formattedAmount = amount.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                    } else {
                        formattedAmount = amount.toLocaleString(undefined, FORMAT_OPTIONS);
                    }
                }
                amountInput.value = formattedAmount;
                const safeDisplayAmount = amount.toLocaleString(undefined, FORMAT_OPTIONS);

                if (isAmountValid && amount >=100) {
                    safeCard.classList.add('show');
                    topUpSafeButton.textContent = `Top up safe with $${safeDisplayAmount}`;
                } else {
                    safeCard.classList.remove('show');
                }
            });
        }

        if (continueButton) {
            continueButton.addEventListener('click', async () => {
                const currentAmountRaw = getRawAmount(amountInput.value);
                const minRequired = getRawAmount(minWithdrawalElement.textContent);

                if (currentAmountRaw < minRequired) {
                    alert(`ERROR: Withdrawal amount ($${currentAmountRaw}) is less than minimum ($${minRequired}).`);
                    return; 
                }
                
                if (currentAmountRaw > realBalance) {
                    alert(`ERROR: Insufficient balance. Available: $${realBalance.toLocaleString(undefined, FORMAT_OPTIONS)}.`);
                    return; 
                }

                setButtonLoaderActive(continueButton, continueLoader, true);
                
                try {
                    await simulateNetworkCall(BUTTON_LOADING_DELAY_MS);
                    setButtonLoaderActive(continueButton, continueLoader, false);
                    
                    withdrawalCard.style.display = 'none';
                    confirmationCard.style.display = 'block';
                    mainContentTitle.textContent = 'Withdrawal';
                    pinMessageElement.innerHTML = `Please confirm your withdrawal request by entering a one-time PIN code sent to your email address: <span style="color: #007eff;">keya@ai.com</span>`; //keya@ai.com keya , synoxbot@offical.com
                    
                    // --- NEW: Load in Confirmation Step ---
                    setConfirmationContentLoaderActive(true);
                    // Use the faster delay for the UI transition (300ms - 700ms)
                    await simulateNetworkCall(CONFIRMATION_LOAD_DELAY_MS);
                    // --- END NEW ---
                } catch (error) {
                    console.error("Continue error:", error);
                } finally {
                    setConfirmationContentLoaderActive(false);
                }
            });
        }

        if (confirmPinButton) {
            confirmPinButton.addEventListener('click', async () => {
                const pinCode = wrapper.querySelector('#pin-code').value;
                if (pinCode.length < 4 || !/^\d+$/.test(pinCode)) {
                    alert(`ERROR: Please enter a valid PIN code.`);
                    return;
                }

                setButtonLoaderActive(confirmPinButton, confirmLoader, true);

                try {
                    await simulateNetworkCall(BUTTON_LOADING_DELAY_MS);
                    setButtonLoaderActive(confirmPinButton, confirmLoader, false);
                    
                    // --- GLOBAL BALANCE DEDUCTION ---
                    const withdrawnAmount = getRawAmount(amountInput.value);
                    if (withdrawnAmount > 0) {
                         realBalance -= withdrawnAmount;
                         if(typeof updateUI === 'function') updateUI(); 
                         if(typeof triggerBalanceUpdate === 'function') triggerBalanceUpdate();
                         if (freeBalanceElement) freeBalanceElement.textContent = `$${realBalance.toLocaleString(undefined, FORMAT_OPTIONS)}`;
                    }

                    confirmationCard.style.display = 'none';
                    successCard.style.display = 'block';
                    mainContentTitle.textContent = 'Withdrawal - Step 2';
                    
                    // Start loader for final transition
                    setFormLoaderActive(true); 
                    await simulateNetworkCall(CONFIRMATION_LOAD_DELAY_MS);
                    
                    // FIX: Hide the main loader after the successful delay
                    setFormLoaderActive(false);

                    setTimeout(() => { animateBadgeCount(); }, BADGE_POP_DELAY_MS);
                } catch (error) {
                    console.error("Confirm PIN error:", error);
                    setFormLoaderActive(false); 
                }
            });
        }

        if (selectOptions) {
            selectOptions.querySelectorAll('.select-option').forEach(option => {
                option.addEventListener('click', async function() {
                    const selectedText = this.textContent;
                    const currencyCode = this.dataset.value;

                    setFormLoaderActive(true);
                    if (selectOptions) selectOptions.classList.remove('show');
                    if (selectHeader) selectHeader.classList.remove('active');

                    try {
                        await simulateNetworkCall(NETWORK_DELAY_MS);
                        if (selectedValueSpan) selectedValueSpan.textContent = selectedText;
                        if (hiddenInput) hiddenInput.value = currencyCode;
                        selectOptions.querySelectorAll('.select-option').forEach(opt => { opt.classList.remove('selected'); });
                        this.classList.add('selected');
                        updateAddressLabel(selectedText);
                        updateMinWithdrawal(currencyCode);
                        amountInput.dispatchEvent(new Event('input'));
                    } catch (error) {
                        console.error("Payment method error:", error);
                    } finally {
                        setFormLoaderActive(false);
                    }
                });
            });
        }

        if (selectHeader) {
            selectHeader.addEventListener('click', (e) => {
                e.stopPropagation();
                selectOptions.classList.toggle('show');
                selectHeader.classList.toggle('active');
            });
        }

        document.addEventListener('click', (event) => {
            if (selectHeader && selectOptions && !selectHeader.contains(event.target) && !selectOptions.contains(event.target)) {
                selectOptions.classList.remove('show');
                selectHeader.classList.remove('active');
            }
        });
    }

    // --- MODIFIED GLOBAL FUNCTION (Fix for Initial Load) ---
    async function openWithdrawalView() {
        const withdrawalView = document.getElementById('withdrawal-view-container');
        const secondaryMenu = document.getElementById('secondary-menu-tools');
        const chartEl = document.querySelector('.trading_chart');
        const mr1 = document.getElementById('mainright1');
        const mr2 = document.querySelector('.mainright2');

        // --- NEW: START LOADER & DELAY (2-3 seconds) ---
        // 1. Show the withdrawal wrapper immediately to utilize its background/loader
        if (withdrawalView) withdrawalView.classList.add('active');
        const loaderOverlay = withdrawalView ? withdrawalView.querySelector('#loader-overlay') : null;
        if (loaderOverlay) loaderOverlay.classList.add('active');
        
        // 2. Hide other elements *before* the delay to get a clean overlay
        if (chartEl) chartEl.style.display = 'none';
        if (mr1) mr1.style.display = 'none';
        if (mr2) mr2.style.display = 'none';
        if (secondaryMenu) secondaryMenu.classList.add('hidden');
        
        // Simulate initial API call/page load time
        function getRandomDelay(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

// Usage:
await new Promise(resolve => setTimeout(resolve, getRandomDelay(500, 3000)));

        
        // 3. Hide the loader when delay is complete
        if (loaderOverlay) loaderOverlay.classList.remove('active');
        // --- END NEW ---

        // 4. Final initialization (calls initWithdrawalPageLogic)
        initWithdrawalPageLogic();
        
        // 5. Cleanup (Close trades panel if open)
        const tradesPanel = document.getElementById('trades-panel');
        if (tradesPanel && tradesPanel.classList.contains('panel-visible')) {
             if(typeof toggleTradesPanel === 'function') toggleTradesPanel(); 
        }
    }

    // Function to close withdrawal (Kept for completeness)
    function closeWithdrawalView() {
        const chartEl = document.querySelector('.trading_chart');
        const mr1 = document.getElementById('mainright1');
        const mr2 = document.querySelector('.mainright2');
        const withdrawalView = document.getElementById('withdrawal-view-container');

        if (chartEl) chartEl.style.display = 'block';
        if (mr1) mr1.style.display = 'flex';
        if (mr2) mr2.style.display = 'flex';
        if (withdrawalView) withdrawalView.classList.remove('active');
        
        if(typeof resize === 'function') resize();
        if(typeof render === 'function') render();
    }
</script>

 * Toggles the main account dropdown visibility, ensuring the opening and closing animations play.

function toggleDropdown(event) {
    const dropdown = document.getElementById('dropdown');
    const widget = document.querySelector('.trade-widget');
    
    // Prevent interaction if clicking on inner buttons
    if (event.target.closest('.btn-square') || event.target.closest('.btn-action-list')) return;

    if (dropdown.classList.contains('show')) {
        // --- CLOSING ANIMATION FIX ---
        dropdown.classList.remove('show');
        widget.classList.remove('active');
        // Apply display: none *AFTER* the CSS transition (0.3s) completes
        setTimeout(() => { 
            // Only set to none if it is not currently in the process of showing
            if(!dropdown.classList.contains('show')) dropdown.style.display = 'none'; 
        }, 300); // Increased to 300ms to match potential CSS transition time
        // --- END CLOSING FIX ---
    } else {
        // --- OPENING ANIMATION FIX (CRITICAL) ---
        // 1. Set display to block (no animation yet)
        dropdown.style.display = 'block';

        // ⭐ CRITICAL FIX: Force Reflow ⭐
        // Reading offsetHeight forces the browser to apply initial styles immediately.
        void dropdown.offsetHeight; 

        // 2. Apply the 'show' class to start the transition
        dropdown.classList.add('show');
        widget.classList.add('active');
        // --- END OPENING FIX ---
    }
}

/**
 * Switches between the Opened and Closed trades tabs.
 */
function switchTab(tabName) {
    const tabOpened = document.getElementById('tab-opened');
    const tabClosed = document.getElementById('tab-closed');
    const openedList = document.getElementById('opened-trades-list');
    const closedList = document.getElementById('closed-trades-list');

    if (!openedList || !closedList) return;

    if (tabName === 'opened') {
        if (tabOpened) tabOpened.classList.add('active');
        if (tabClosed) tabClosed.classList.remove('active');

        // FORCE display states to fix the overlap glitch
        openedList.classList.remove('hidden');
        openedList.style.display = 'block';

        closedList.classList.add('hidden');
        closedList.style.display = 'none'; // <-- THIS STOPS THE GLITCH!
    } else {
        if (tabOpened) tabOpened.classList.remove('active');
        if (tabClosed) tabClosed.classList.add('active');

        openedList.classList.add('hidden');
        openedList.style.display = 'none';

        closedList.classList.remove('hidden');
        closedList.style.display = 'block';
    }
}

        /**
         * Formats a number to USD format: thousands comma, fixed to 2 decimal places.
         * Optionally removes trailing .00 if the number is an integer.
         * @param {number} number The number to format.
         * @param {boolean} includeSign If true, includes + for positive numbers.
         * @returns {string} Formatted string.
         */
        function formatUSD(number, includeSign = false) {
            if (number === undefined || number === null || isNaN(number)) return '$0';
            
            const num = parseFloat(number);
            const sign = includeSign && num > 0 ? '+' : '';
            const absNum = Math.abs(num);

            // Check if it's a round figure 
            if (absNum % 1 === 0) {
                // If round, format without decimals
                const formatted = absNum.toLocaleString('en-US', {
                    maximumFractionDigits: 0
                });
                return sign + '$' + formatted;
            } else {
                // If non-round, format with 2 decimals
                const formatted = absNum.toLocaleString('en-US', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
                return sign + '$' + formatted;
            }
        }

function internalToMonetary(internalPrice) {
    const monetaryDiff = internalPrice * MONETARY_CONVERSION_RATIO;
    return BASE_MONETARY_PRICE + monetaryDiff;

function calculateSmartScale() {
    if (candles.length === 0) {
        visibleCenterPrice = canvas.height / 2;
        currentYScale = DEFAULT_SCALE;
        return;
    }
    const step = BODY_WIDTH * 1.2;
    const canvasWidth = canvas.width;
    
    const buffer = step * 1.0; 
    
    const startIndex = Math.max(0, Math.floor((scrollOffset + buffer) / step));
    const endIndex = Math.min(candles.length - 1, Math.floor((scrollOffset + canvasWidth - buffer) / step));

    let minLow = Infinity;
    let maxHigh = -Infinity;

    if (startIndex > endIndex) {
        visibleCenterPrice = canvas.height / 2;
        currentYScale = DEFAULT_SCALE;
        return;
    }

    for (let i = startIndex; i <= endIndex; i++) {
        if (candles[i].low < minLow) minLow = candles[i].low;
        if (candles[i].high > maxHigh) maxHigh = candles[i].high;
    }

    if (minLow === Infinity || maxHigh === -Infinity) {
        visibleCenterPrice = canvas.height / 2; 
        currentYScale = DEFAULT_SCALE;
        return;
    }

    visibleCenterPrice = (minLow + maxHigh) / 2;
    const range = maxHigh - minLow;
    
    // Increased amplitude by multiplying maxAllowedPixels by 3 to achieve "3px = 1px" cursor effect
    const maxAllowedPixels = (canvas.height * 0.43) * 1;
    
    let requiredScale = range > 0.000001 ? maxAllowedPixels / range : DEFAULT_SCALE;

    currentYScale = requiredScale;
}

function py(v) {
    const chartCenterY = canvas.height / 2 - 100;
    const priceDifference = v - visibleCenterPrice;
    const pixelDistance = priceDifference * currentYScale;
    return chartCenterY - pixelDistance;
}


function drawCandleBody(c, index) {
    const step = BODY_WIDTH * 1.2;
    const x = index * step - scrollOffset;
    if (x < -step || x > canvas.width + step) return;

    const color = c.close >= c.open ? "rgba(78, 189, 62)" : "rgb(250, 58, 27)";
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;

    // Wick
    ctx.beginPath();
    ctx.moveTo(x, py(c.high));
    ctx.lineTo(x, py(c.low));
    ctx.stroke();

    // Body
    ctx.lineWidth = BODY_WIDTH * 1.1;
    let yOpen = py(c.open);
    let yClose = py(c.close);

    if (Math.abs(yOpen - yClose) < 1) {
        yClose = c.close >= c.open ? yOpen - 1 : yOpen + 1;
    }

    ctx.beginPath();
    ctx.moveTo(x, yOpen);
    ctx.lineTo(x, yClose);
    ctx.stroke();
}

function drawPriceScale() {

    const topMonetary = internalToMonetary(topPriceInternal);
    
    const bottomPriceInternal = visibleCenterPrice - (CHART_HEIGHT / 2) / currentYScale;
    const bottomMonetary = internalToMonetary(bottomPriceInternal);
    
    const range = topMonetary - bottomMonetary;
    
    const baseUnit = 0.00001;
    const stepCandidates = [10, 20, 50, 100, 500];
    
    let selectedStep = stepCandidates[stepCandidates.length - 1] * baseUnit; 
    
    for (let i = 0; i < stepCandidates.length; i++) {
        const s = stepCandidates[i] * baseUnit;
        const count = range / s;
        
        if (count <= 6) {
            selectedStep = s;
            break; 
        }
    }

    const startTick = Math.ceil(bottomMonetary / selectedStep) * selectedStep;
    
    for (let p = startTick; p <= topMonetary + selectedStep; p += selectedStep) {
        const internalP = (p - BASE_MONETARY_PRICE) / MONETARY_CONVERSION_RATIO;
        const yCoord = py(internalP);
        
        ctx.strokeStyle = VERTICAL_GRID_COLOR;

    }

// === Helper to animate numbers ===
function animateValue(obj, start, end, duration) {
    let startTimestamp = null;
    const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        // Easing (optional) or linear
        const currentVal = Math.floor(progress * (end - start) + start);
        obj.innerHTML = currentVal + "%";
        if (progress < 1) {
            window.requestAnimationFrame(step);
        }
    };
    window.requestAnimationFrame(step);
}

let tradeLineElements = new Map();

function drawActiveTrades() {
    // 1. Clear everything if no trades or candles
    if (!activeTrades.length || !candles.length) {
        tradeLineElements.forEach(elements => {
            if (elements.path) elements.path.remove();
            if (elements.priceLine) elements.priceLine.remove();
        });
        tradeLineElements.clear();
        
        const badgeContainer = document.getElementById('activeTradeBadgesContainer');
        if (badgeContainer) badgeContainer.innerHTML = '';
        return;
    }

    const step = BODY_WIDTH * 1.2;
    const sortedTrades = [...activeTrades].sort((a,b) => a.startTime - b.startTime);
    const placedBadges = [];
    
    const linesContainer = document.getElementById('trade-lines-container');
    if (!linesContainer) return;

    // --- HTML BADGES OVERLAY SETUP ---
    let badgeContainer = document.getElementById('activeTradeBadgesContainer');
    if (!badgeContainer) {
        const chartWrapper = document.querySelector('.trading_chart') || canvas.parentElement;
        badgeContainer = document.createElement('div');
        badgeContainer.id = 'activeTradeBadgesContainer';
        badgeContainer.style.cssText = `
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 14;
            overflow: hidden;
        `;
        chartWrapper.appendChild(badgeContainer);
    }
    badgeContainer.innerHTML = '';
    
    // 2. Clean up closed trades
    const activeIds = activeTrades.map(t => t.id);
    for (const [tradeId, elements] of tradeLineElements.entries()) {
        if (!activeIds.includes(tradeId)) {
            if (elements.path) elements.path.remove();
            if (elements.priceLine) elements.priceLine.remove();
            tradeLineElements.delete(tradeId);
        }
    }

    sortedTrades.forEach(trade => {
        // 3. Calculate Start Position
        const tradeCandleX = (trade.startIndex * step) - scrollOffset;
        const tradePriceY = py(trade.entryPrice);
        
        if (tradeCandleX < -200 || tradeCandleX > canvas.width + 200) return;

        // 4. Draw Start Dot (Canvas)
        const dotRadius = 2.5;
        ctx.beginPath();
        ctx.arc(tradeCandleX, tradePriceY, dotRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 1;
        ctx.stroke();

        // 5. Determine Win/Loss Status
        const currentPrice = candles[candles.length - 1].close;
        let isWin = false;
        if (trade.type === 'buy') isWin = currentPrice > trade.entryPrice;
        else isWin = currentPrice < trade.entryPrice;
        
        const badgeColor = trade.type === 'buy' ? 'rgba(72, 160, 72, 0)' : 'rgba(242, 88, 27, 0)';
        
        // 6. DOM Elements Management for Lines
        let lineElements = tradeLineElements.get(trade.id);
        if (!lineElements) {
            const pathLine = document.createElement('div');
            pathLine.className = 'trade-path-line';
            
            const priceLine = document.createElement('div');
            priceLine.className = 'trade-price-line';
            
            const lineIcon = document.createElement('div');
            lineIcon.className = 'trade-line-icon';
            lineIcon.innerHTML = '<i class="fa-regular fa-bookmark fa-rotate-270" style="position: relative; left: 4px; top:2px;"></i>';
            
            linesContainer.appendChild(pathLine);
            linesContainer.appendChild(priceLine);
            priceLine.appendChild(lineIcon); 
            
            lineElements = { path: pathLine, priceLine: priceLine, lineIcon: lineIcon }; 
            tradeLineElements.set(trade.id, lineElements);
        }
        
        // 7. Static Position Calculation
        const baseCandleOffset = Math.ceil(trade.duration / 1000 / CANDLE_TIME);
        const targetCandleOffset = baseCandleOffset + 0.8; 
        
        const fixedExpirationX_Chart = (trade.startIndex + targetCandleOffset) * step; 
        const fixedExpirationX_Screen = fixedExpirationX_Chart - scrollOffset;

        // Path Line & Vertical Price Line Position
        const pathLineStart = tradeCandleX + dotRadius;
        const width = fixedExpirationX_Screen - pathLineStart; 
        const lineColor = trade.type === 'buy' ? 'rgba(78, 189, 62, 0.5)' : 'rgba(250, 58, 27, 0.5)';

        lineElements.path.style.left = pathLineStart + 'px';
        lineElements.path.style.top = tradePriceY + 'px';
        lineElements.path.style.width = Math.max(0, width) + 'px'; 
        lineElements.path.style.backgroundColor = lineColor;

        const vLineColor = '#446995';
        lineElements.priceLine.style.left = fixedExpirationX_Screen + 'px';
        lineElements.priceLine.style.backgroundColor = vLineColor;

        // 8. Badge Dimensions & Collision Logic (Exact Original Rules Kept)
        const TOP_PADDING = 4; 
        const BASE_BADGE_H = 32; 
        const MIN_BADGE_W = 48;        
        const HORIZONTAL_PADDING = 20; 

        const arrow = trade.type === 'buy' ? '▲' : '▼';
        const amountStrFormatted = formatUSD(trade.amount, false); 
        const combinedText = arrow + '' + amountStrFormatted;

        ctx.save(); 
        ctx.font = '400 11px "Noto Sans"'; 
        const textWidth = ctx.measureText(combinedText).width;
        ctx.restore(); 

        let requiredWidth = textWidth + HORIZONTAL_PADDING;
        const badgeW = Math.max(requiredWidth, MIN_BADGE_W);
        const badgeH = BASE_BADGE_H + TOP_PADDING; 

        const margin = 5; 
        let badgeX = tradeCandleX - margin - badgeW;
        let badgeY = tradePriceY - (BASE_BADGE_H / 2);

        // Original Collision Loop
        let collision = true;
        let loopCount = 0;
        while (collision && loopCount < 50) {
            collision = false;
            for (let p of placedBadges) {
                const verticalGap = 4; 
                const isVerticallyOverlapping = 
                    (badgeY < p.y + p.h + verticalGap) && 
                    (badgeY + badgeH + verticalGap > p.y);
                
                if (isVerticallyOverlapping) {
                    const isHorizontallyOverlapping = 
                        (badgeX < p.x + p.w) && 
                        (badgeX + badgeW > p.x);
                        
                    if (isHorizontallyOverlapping) {
                        badgeX = p.x - 9 - badgeW; 
                        collision = true;
                        break; 
                    }
                }
            }
            loopCount++;
        }
        placedBadges.push({x: badgeX, y: badgeY, w: badgeW, h: badgeH});

        // Countdown Timer Formatting (Exact Original Logic)
        const now = Date.now();
        const elapsed = now - trade.startTime;
        const remaining = Math.max(0, trade.duration - elapsed);
        const totalSeconds = Math.ceil(remaining / 1000);
        const mm = Math.floor(totalSeconds / 60);
        const ss = totalSeconds % 60;
        const timeStr = String(mm).padStart(2, '0') + ":" + String(ss).padStart(2, '0');

        // --- RENDER HTML VECTOR BADGE (Replaces Canvas Drawing) ---
        const badgeEl = document.createElement('div');
        badgeEl.style.cssText = `
            position: absolute;
            left: ${badgeX}px;
            top: ${badgeY}px;
            width: ${badgeW}px;
            height: ${badgeH}px;
            background-color: ${badgeColor};
            border-radius: 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding-top: ${TOP_PADDING}px;
            -webkit-font-smoothing: antialiased;
        `;

        const textAmountEl = document.createElement('div');
        textAmountEl.style.cssText = `
            color:white;
            font-family: "Noto Sans", sans-serif;
            font-size: 11px;
            font-weight: 400;
            line-height: 1;
            white-space: nowrap;
        `;
        textAmountEl.textContent = combinedText;

        const textTimerEl = document.createElement('div');
        textTimerEl.style.cssText = `
            color: #9faba9;
            font-family: Inter, sans-serif;
            font-size: 10px;
            font-weight: 600;
            line-height: 1;
            margin-top: 3px;
            white-space: nowrap;
        `;
        textTimerEl.textContent = timeStr;

        badgeEl.appendChild(textAmountEl);
        badgeEl.appendChild(textTimerEl);
        badgeContainer.appendChild(badgeEl);
    });
}

// Process and show accumulated results
function processResultBuffer() {
    if (resultBuffer.length === 0 || candles.length === 0) return;
    
    const wins = [];
    const losses = [];
    let totalPayout = 0;
    let totalLoss = 0;
    
    resultBuffer.forEach(t => {
        // --- NEW: Add to Closed Trades UI ---
        addClosedTradeCard(t);
        
        if(t.isWin) {
            wins.push(t);
            totalPayout += t.payout;
        } else {
            losses.push(t);
            totalLoss += t.amount;
        }
    });
    
    // Determine anchor index (use last closed trade's index or current candle)
    const anchorIndex = candles.length - 1;
    const anchorPrice = candles[anchorIndex].close; // Approximate Y anchor
    
    // Show Win Popup if any
    if(wins.length > 0) {
        createPopupElement(totalPayout, 'win', anchorIndex, anchorPrice);
    }
    
    // Show Loss Popup if any
    if(losses.length > 0) {
        createPopupElement(0, 'loss', anchorIndex, anchorPrice);
    }
    
    // Clear buffer
    resultBuffer = [];
}

function addClosedTradeCard(trade) {
    const closedList = document.getElementById('closed-trades-list');
    if (!closedList) return;
    
    // Calculate exact "Simulated" end time for HH:MM display
    const startHour = 10;
    const endSecondsTotal = trade.simulatedStartSeconds + (trade.duration / 1000);
    
    let hh = startHour;
    let mm = Math.floor(endSecondsTotal / 60);
    let ss = Math.floor(endSecondsTotal % 60);
    
    // Handle minute/hour overflow
    hh += Math.floor(mm / 60);
    mm = mm % 60;
    hh = hh % 24;
    
    // Format time without seconds (Request 2)
    const timeStr = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`; 
    
    // Colors & Values
    const isWin = trade.isWin;
    // Use stored payout percentage
    const profitRate = trade.payoutPercentage / 100;
    const profitAmount = trade.amount * profitRate;
    
    let profitVal, gainVal;
    let midValColor = isWin ? '#6fc274' : 'white'; 
    let rightValColor = isWin ? '#6fc274' : 'white'; 

    if (isWin) {
        profitVal = formatUSD(trade.payout, false); 
        gainVal = formatUSD(profitAmount, true); 
    } else {
        profitVal = formatUSD(0, false); 
        gainVal = formatUSD(0, false);
    }
    
    // Arrow color
    const arrowColor = trade.type === 'buy' ? '#22c55e' : '#ef4444';
    const payoutText = `+${trade.payoutPercentage}%`; 

    const cardHTML = `
        <div class="trade-card closed-trade" data-id="${trade.id}">
            <div class="trade-header-row">
                <div class="pair-info">
                    <i class="fa-regular fa-star star-icon"></i>
                    <span class="pair-name">${trade.symbol}</span>
                    <span class="profit-percent" style="color:#6fc274; font-weight:200; font-size:14px; font-family:"Noto Sans", Arial, sans-serif;">${payoutText}</span>
                </div>
                <span class="timer" style="font-family:'Noto Sans'; font-weight:500; color:white; font-size:15px; letter-spacing:0.7px;">${timeStr}</span>
            </div>

            <div class="trade-values-row">
                <div class="investment">
                    <div class="trade-arrow-svg-container" 
                         data-type="${trade.type}" 
                         style="display:flex; align-items:center; width:px; height:20px; color:${arrowColor};">
                    </div>
                    <span>${formatUSD(trade.amount, false)}</span>
                </div>
                <span class="mid-value" 
      style="font-weight:400; text-align:center; position:absolute; left:50%; transform:translateX(-50%); color:${midValColor};">
    ${profitVal}
</span>

                <span class="right-value" style="font-weight:400; color:${rightValColor};">${gainVal}</span>
            </div>
        </div>
    `;
    
    // Set the date header 
    const date = new Date();
    const formattedDate = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;

    if(closedTradeDateHeader) {
        closedTradeDateHeader.textContent = formattedDate;
    }
    
    // Insert card
    const dateHeader = closedList.querySelector('.date-header');
    if(dateHeader) {
        dateHeader.insertAdjacentHTML('afterend', cardHTML);
    } else {
        closedList.innerHTML += cardHTML;
    }
    closedTrades.unshift(trade); // Add to closed trade list
    
    // ⭐ NEW: FIND THE NEWLY CREATED CARD AND APPLY SVG LOGIC ⭐
    // We must find the element *after* it's inserted into the DOM.
    const newCard = closedList.querySelector(`.trade-card[data-id="${trade.id}"]`);
    if (newCard) {
    // Use the generic class name defined in the HTML template
    const svgContainer = newCard.querySelector('.trade-arrow-svg-container');
    const isBuy = trade.type === 'buy';

    if (svgContainer) {
        // 1. Inject SVG (Uses the constants defined in the global script block)
        svgContainer.innerHTML = isBuy ? PANEL_UP_ARROW_SVG : PANEL_DOWN_ARROW_SVG;
        
        // 2. Apply Rotation
        const svgElement = svgContainer.querySelector('svg');
        if (svgElement) {
            // Apply the same transformation used in opened trades
            if (isBuy) {
                // For Buy: Upright
                svgElement.style.transform = 'scale(0.95) rotate(-90deg)';
            } else {
                // For Sell: Rotated 180 degrees
                svgElement.style.transform = 'scale(0.95)';
            }

            svgElement.style.marginRight = '0px';
            svgElement.style.minWidth = '0px';

            svgElement.querySelectorAll('*').forEach(el => {

                // Different colors for BUY / SELL

                el.setAttribute('stroke-width', '0.8');
                el.setAttribute('vector-effect', 'non-scaling-stroke');
            });

            }
        }
    }

function updateResultPopups() {
    if (candles.length === 0) return;
    
    const step = BODY_WIDTH * 1.2;
    
    // Loop through active popups and update/remove
    const now = Date.now();
    // Use a map to track stacking at same candleIndex
    const stackMap = {}; 
    
    for (let i = activeResultPopups.length - 1; i >= 0; i--) {
        const popup = activeResultPopups[i];
        
        // Remove after 3 seconds
        if (now - popup.startTime > 7000) {
            popup.el.remove();
            activeResultPopups.splice(i, 1);
            continue;
        }
        
        // Update position based on its specific candleIndex
        // Note: Use stored candle index relative to scroll
        // Center of candle X:
        const xPos = (popup.candleIndex * step) - scrollOffset; 
        
        const yPos = py(popup.price);
        const clampedY = Math.max(70, Math.min(canvas.height - 70, yPos));
        
        // Simple stacking logic if multiple popups exist for same index
        const stackCount = stackMap[popup.candleIndex] || 0;
        stackMap[popup.candleIndex] = stackCount + 1;
        
        // Stack vertically above price
        const yOffset = stackCount * 50; // 50px vertical spacing
        
        popup.el.style.left = xPos + 'px';
        popup.el.style.top = (clampedY - 40 - yOffset) + 'px';
        popup.el.style.transform = 'translate(-50%, 0)';
        
        // If off screen to left, maybe hide? (optional)
        if (xPos < -50) popup.el.style.opacity = '0';
        else popup.el.style.opacity = '1';
    }
}

// --- NEW GLOBAL STATE FOR DYNAMIC CHART MARGIN ---
let dynamicRightMarginFactor = 0.35; // Default value (35%)

// New function for smooth scrolling
function smoothScrollTo(targetOffset) {
    const duration = 400; // 400ms animation duration
    const startOffset = scrollOffset;
    const startTime = performance.now();

    const animateScroll = (currentTime) => {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // Easing function (easeOutQuad) for smoother look
        const easedProgress = progress * (2 - progress); 
        
        scrollOffset = startOffset + (targetOffset - startOffset) * easedProgress;

        clampScrollOffset(); // Always clamp after setting
        render();

        if (progress < 1) {
            requestAnimationFrame(animateScroll);
        } else {
            // Ensure we snap precisely to the final target to avoid drift
            scrollOffset = targetOffset;
            clampScrollOffset();
            render();
        }
    };

    requestAnimationFrame(animateScroll);
}


function clampScrollOffset() {
    const step = BODY_WIDTH * 1.2;
    const canvasWidth = canvas.width;
    const totalCandleWidth = candles.length * step;
    const rightMarginWidth = canvasWidth * dynamicRightMarginFactor;
    const effectiveVisibleWidth = canvasWidth - rightMarginWidth;
    let maxScroll = totalCandleWidth - effectiveVisibleWidth;
    maxScroll = Math.max(0, maxScroll); 
    
    if (scrollOffset < 0) {
        scrollOffset = 0; 
    } else if (scrollOffset > maxScroll) {
        scrollOffset = maxScroll; 
    }
}

async function createInitialCandles(count) {

                const type = Math.random();
                let gapSize;

                else gapSize = (Math.random() * 33) - 30;
                open = prevClose + gapSize;
            } else {
                open = prevClose;
            }
        }
        
        let close = open;
        let high = open;
        let low = open;
        
        // --- REPLICATE CORE CANDLE MOVEMENT LOGIC (NO ANIMATION/TIMING) ---

        // 1. Loop through the number of seconds in the candle (CANDLE_TIME = 5 in your code)
        for (let sec = CANDLE_TIME; sec > 0; sec--) {
            // 2. Loop through the moves within that second (moves = 2 in your code)

                    if (close < low) low = close;
                }
            }
        }

// --- BUG-FIXED DYNAMIC RUN FUNCTION ---
async function run() {
    const CANDLE_DURATION_MS = 5000; // 5 seconds interval
    const now = new Date();

    // 1. Define the Anchor Time (10:00:00 AM)
    let startTime = new Date();
    startTime.setHours(09, 59, 54, 0);

    // FIX: If current real time is BEFORE 10 AM, 
    // we must start counting from 10 AM YESTERDAY to bridge the gap.
    if (now < startTime) {
        startTime.setDate(startTime.getDate() - 1);
    }

    // 2. Calculate alignment (Freeze Logic)
    const msPastLastBoundary = now.getTime() % CANDLE_DURATION_MS;
    const msToWait = CANDLE_DURATION_MS - msPastLastBoundary;

    // 3. Calculate Dynamic Candle Count (24h Compatible)
    const alignedCurrentTime = now.getTime() - msPastLastBoundary;
    const elapsedMs = alignedCurrentTime - startTime.getTime();
    
    // Calculate total candles needed to reach 10:00 AM
    let dynamicCount = Math.floor(elapsedMs / CANDLE_DURATION_MS);
    
    // Ensure we don't go below 250 for chart stability
    const INITIAL_CANDLE_COUNT = Math.max(dynamicCount, 250);

    console.log(`Generating ${INITIAL_CANDLE_COUNT} candles to align with 10:00 AM baseline.`);

    // 4. Create Initial Candles
    await createInitialCandles(INITIAL_CANDLE_COUNT);

    // 5. Set scroll offset
    const step = BODY_WIDTH * 1.2;
    const canvasWidth = canvas.width;
    const rightMarginWidth = canvasWidth * dynamicRightMarginFactor;
    const effectiveVisibleWidth = canvasWidth - rightMarginWidth;
    let maxScroll = (candles.length * step) - effectiveVisibleWidth;
    scrollOffset = Math.max(0, maxScroll); 

    // 6. Render static chart
    render();

    // 7. Start Loop precisely on the 5s mark
    setTimeout(async () => {
        // Continuous real-time loop
        for (let i = INITIAL_CANDLE_COUNT; i > 0; i++) {
            await createCandle(i);
        }
    }, msToWait);
}

                const code1 = COUNTRY_CODE_MAP[codes[0]] || 'un'; 
                const code2 = COUNTRY_CODE_MAP[codes[1]] || 'un';
                return {

                    flag2Class: `fi fi-${code2}` 
                };

            function generateRandomValue() {

                const max = 0.60000;
                let value = Math.random() * (max - min) + min;
                const isIncreasing = Math.random() > 0.5;
                
                randomValueSpan.textContent = value.toFixed(5);
                randomValueSpan.style.color = isIncreasing ? '#00e167' : '#ff3b3b';
            }

            generateRandomValue();
            let intervalId = null;

            symbolButton.addEventListener('mouseenter', () => {
                if (!assetSelectorModal.classList.contains('visible')) {
                    intervalId = setInterval(generateRandomValue, 500);
                }
            });

            symbolButton.addEventListener('mouseleave', () => {
                if (intervalId !== null) {
                    clearInterval(intervalId);
                    intervalId = null;
                }
            });

            // --- Interaction Logic ---
            function closeChartSettingsPopover() {
                chartSettingsPopover.classList.remove('visible');
            }

            function closeAssetSelectorModal() {
                assetSelectorModal.classList.remove('visible');
                symbolButton.classList.remove('active');

            chartTypeButton.addEventListener('click', (event) => {
                event.stopPropagation();
                closeAssetSelectorModal();
                chartSettingsPopover.classList.toggle('visible');

            symbolButton.addEventListener('click', (event) => {
                event.stopPropagation();
                closeChartSettingsPopover();
                assetSelectorModal.classList.toggle('visible');
                symbolButton.classList.toggle('active');
            });

            assetListContainer.addEventListener('click', (event) => {
                // STOP PROPAGATION HERE TO PREVENT CLOSING
                event.stopPropagation();

                // 1. Logic to check if user is just selecting text
                const selection = window.getSelection();
                if (selection.toString().length > 0) {
                    return; // Exit if text is highlighted

                const isAssetItem = event.target.closest('.asset-list-item');
                if (isAssetItem) {

                    const selectedSymbol = isAssetItem.dataset.symbol;

                    CURRENCY_PAIRS.forEach(asset => {

                    currentPairSymbol = selectedSymbol; // NEW: Update global symbol state (Request 1)
                    
                    symbolText.textContent = selectedSymbol;

                    if(typeof updatePanelFromGlobal === 'function') {

            renderAssetList();

<script>
document.addEventListener("DOMContentLoaded", () => {

  const menu = document.querySelector(".dropdown-menu");
  const widgetBtn = document.querySelector(".trade-widget");        
  const profileBtn = document.querySelector(".user-profile-wrapper"); 
  const mainArrow = document.querySelector(".main-arrow");          

  const triggers = [widgetBtn, profileBtn, mainArrow].filter(Boolean);

  let isOpen = false;

  function openDropdown() {
    if (menu) menu.classList.add("show");
    if (widgetBtn) widgetBtn.classList.add("active");
    isOpen = true;
  }

  function closeDropdown() {
    if (menu) menu.classList.remove("show");
    if (widgetBtn) widgetBtn.classList.remove("active");
    isOpen = false;
  }

  function toggleDropdown() {
    if (isOpen) closeDropdown();
    else openDropdown();
  }

  triggers.forEach(trigger => {
    trigger.addEventListener("click", (ev) => {
      ev.stopPropagation();
      toggleDropdown();
    });
  });

  document.addEventListener("pointerdown", (ev) => {
    if (!isOpen) return;

    const clickedInsideMenu = menu && menu.contains(ev.target);
    const clickedInsideTrigger = triggers.some(t => t.contains(ev.target));

    if (!clickedInsideMenu && !clickedInsideTrigger) {
      closeDropdown();
    }
  });

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && isOpen) {
      closeDropdown();
    }
  });
});


</script>

// SMOOTH PINCH-TO-ZOOM (FINGER MIDPOINT ANCHORED) & DRAG HANDLER
// ==========================================================================
(function initAnchoredTouchControls() {
    window.addEventListener('DOMContentLoaded', () => {
        const chartArea = document.querySelector('.trading_chart') || document.getElementById('chartCanvas');
        if (!chartArea) return;

        let isDragging = false;
        let lastTouchX = 0;
        let initialPinchDist = 0;
        let startBodyWidth = 37;
        let startScrollOffset = 0;
        let pinchMidpointX = 0;

        function getDistance(t1, t2) {
            return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        }

        function safeRender() {
            if (typeof window.clampScrollOffset === 'function') window.clampScrollOffset();
            if (typeof clampScrollOffset === 'function') clampScrollOffset();
            if (typeof window.render === 'function') window.render();
            else if (typeof render === 'function') render();
        }

        // TOUCH START
        chartArea.addEventListener('touchstart', (e) => {
            if (e.target.closest('input, button, select, .btn, .trade-widget')) return;

            if (e.touches.length === 1) {
                isDragging = true;
                lastTouchX = e.touches[0].clientX;
            } else if (e.touches.length === 2) {
                isDragging = false;
                const t1 = e.touches[0];
                const t2 = e.touches[1];

                initialPinchDist = getDistance(t1, t2);
                
                // Get current values safely
                startBodyWidth = typeof BODY_WIDTH !== 'undefined' ? BODY_WIDTH : 37;
                startScrollOffset = typeof scrollOffset !== 'undefined' ? scrollOffset : 0;

                // Find exact screen X coordinate between two fingers
                const rect = chartArea.getBoundingClientRect();
                pinchMidpointX = ((t1.clientX + t2.clientX) / 2) - rect.left;
            }
        }, { passive: false });

        // TOUCH MOVE (Drag & Centered Zoom)
        chartArea.addEventListener('touchmove', (e) => {
            if (e.target.closest('input, button, select, .btn, .trade-widget')) return;
            e.preventDefault(); // Stop mobile pull-refresh & scroll

            // 1. Single Finger Pan (Drag)
            if (e.touches.length === 1 && isDragging) {
                const currentX = e.touches[0].clientX;
                const deltaX = lastTouchX - currentX;
                lastTouchX = currentX;

                if (typeof scrollOffset !== 'undefined') scrollOffset += deltaX;
                if (typeof window.scrollOffset !== 'undefined') window.scrollOffset += deltaX;

                safeRender();
            } 
            // 2. Two Finger Pinch-to-Zoom (Anchored to Midpoint)
            else if (e.touches.length === 2 && initialPinchDist > 0) {
                const currentDist = getDistance(e.touches[0], e.touches[1]);
                
                // Calculate scale factor with dampening so it doesn't zoom too fast
                const rawScale = currentDist / initialPinchDist;
                // Softened scale curve for controlled, smooth zooming
                const scale = 1 + (rawScale - 1) * 2; 

                const oldStep = startBodyWidth * 1.2;
                let newBodyWidth = Math.max(4, Math.min(42, startBodyWidth * scale));
                const newStep = newBodyWidth * 1.2;

                // Update global candle width
                if (typeof BODY_WIDTH !== 'undefined') BODY_WIDTH = newBodyWidth;
                if (typeof window.BODY_WIDTH !== 'undefined') window.BODY_WIDTH = newBodyWidth;

                // Anchor Math: Adjust scrollOffset so the candle under your fingers stays stationary
                const focalIndex = (startScrollOffset + pinchMidpointX) / oldStep;
                const newScrollOffset = (focalIndex * newStep) - pinchMidpointX;

                if (typeof scrollOffset !== 'undefined') scrollOffset = newScrollOffset;
                if (typeof window.scrollOffset !== 'undefined') window.scrollOffset = newScrollOffset;

                safeRender();
            }
        }, { passive: false });

        // TOUCH END
        chartArea.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDist = 0;
            }
            if (e.touches.length === 0) {
                isDragging = false;
            }
        });
    });
})();

  <script>
    function loadExternalSite() {
      const template = document.getElementById('external-site-template');
      const iframe = document.getElementById('hosted-frame');
      let htmlContent = template.innerHTML.trim();
      if (!htmlContent) {
        htmlContent = `<h2 style="font-family:sans-serif;text-align:center;margin-top:40px;color:#888;">Paste your HTML inside the &lt;template&gt; tag above</h2>`;
      }

      const blob = new Blob([htmlContent], { type: 'text/html' });
      iframe.src = URL.createObjectURL(blob);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadExternalSite();

      // DOM Elements
      const header = document.getElementById('browser-header');
      const viewport = document.getElementById('browser-viewport');
      const leftIcon = document.getElementById('action-left-icon');
      const centerIcon = document.getElementById('action-center-icon');
      const rightIcon = document.getElementById('action-right-icon');
      const reloadFaIcon = document.getElementById('reload-icon-fa');
      const reloadCircleBg = document.getElementById('reload-circle-bg');
      const reloadLabelText = document.getElementById('reload-label-text');
      const releaseExpandCircle = document.getElementById('release-expand-circle');
      const progressBar = document.getElementById('header-progress-bar');
      const svgOverlay1 = document.getElementById('svg-overlay-container');
      const svgOverlay2 = document.getElementById('svg-overlay-container-2');
      const svgOverlay3 = document.getElementById('svg-overlay-container-3');
      const svgOverlay4 = document.getElementById('svg-overlay-container-4');

      const animatedElements = [header, viewport, leftIcon, centerIcon, rightIcon];

      // Drag Physics Parameters
      let isDragging = false;
      let startY = 0;
      let currentDeltaY = 0;

      const MAX_VIEWPORT_PULL = 160;
      const MAX_HEADER_PULL = 120;  
      const RESISTANCE = 150;       
      const TRIGGER_THRESHOLD = 45; 
      
      const RELEASE_DURATION = 0.50; 

      function disableTransitions() {
        animatedElements.forEach(el => {
          el.style.transition = 'none';
        });
      }

      function handleDragStart(e) {
        isDragging = true;
        startY = e.touches ? e.touches[0].clientY : e.clientY;

        disableTransitions();
        releaseExpandCircle.classList.remove('animating');
      }

      function handleDragMove(e) {
        if (!isDragging) return;

        const currentY = e.touches ? e.touches[0].clientY : e.clientY;
        const rawDeltaY = currentY - startY;

        if (rawDeltaY <= 0) {
          currentDeltaY = 0;
          applyDragPositions(0, 0);
          return;
        }

        if (e.cancelable) e.preventDefault();

        currentDeltaY = rawDeltaY;
        const dampedViewportPull = MAX_VIEWPORT_PULL * (1 - Math.exp(-rawDeltaY / RESISTANCE));
        const dampedHeaderPull = MAX_HEADER_PULL * (1 - Math.exp(-rawDeltaY / RESISTANCE));

        applyDragPositions(dampedViewportPull, dampedHeaderPull);
      }

      function applyDragPositions(viewportPull, headerPull) {
        viewport.style.transform = `translate3d(0, ${viewportPull}px, 0)`;

        const headerOpacity = Math.max(0, 1 - (headerPull / 5));
        header.style.transform = `translate3d(0, ${headerPull}px, 0)`;
        header.style.opacity = headerOpacity;

        const dropY = Math.min(82, headerPull * 0.75);
        const centerOpacity = Math.min(1, headerPull / 50);
        const reloadRotation = Math.min(160, headerPull * 2.7);

        centerIcon.style.transform = `translate3d(0, ${dropY}px, 0) scale(1)`;
        centerIcon.style.opacity = centerOpacity;
        reloadFaIcon.style.transform = `rotate(${reloadRotation}deg)`;

        const isTriggered = headerPull >= TRIGGER_THRESHOLD;
        reloadCircleBg.style.transform = `scale(${isTriggered ? 1 : 0})`;
        reloadCircleBg.style.opacity = isTriggered ? '1' : '0';

        const sideProgress = Math.min(1, headerPull / 60);
        const leftX = -70 - (sideProgress * 65);
        const rightX = 70 + (sideProgress * 65);

        leftIcon.style.transform = `translate3d(${leftX}px, ${dropY}px, 0) scale(1)`;
        leftIcon.style.opacity = sideProgress;

        rightIcon.style.transform = `translate3d(${rightX}px, ${dropY}px, 0) scale(1)`;
        rightIcon.style.opacity = sideProgress;

        if (isTriggered) {
          centerIcon.style.color = 'black';
          reloadLabelText.classList.add('visible');
        } else {
          centerIcon.style.color = 'black';
          reloadLabelText.classList.remove('visible');
        }
      }

    function triggerProgressBarAnimation() {
  progressBar.style.transition = 'none';
  progressBar.style.width = '0%';
  progressBar.style.opacity = '1';

  requestAnimationFrame(() => {
    // 1. Instantly move to 10% progress
    progressBar.style.transition = 'width 0.18s cubic-bezier(0.1, 0.8, 0.2, 1), opacity 0.2s ease';
    progressBar.style.width = '10%';

    const randomPauseDuration = Math.floor(Math.random() * 1200) + 700;

    // 2. Single timeout: Executes when the 10% pause finishes
    setTimeout(() => {
      
      // A. START FILLING PROGRESS TO 100%
      progressBar.style.transition = 'width 0.65s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease';
      progressBar.style.width = '100%';

      setTimeout(() => {
        progressBar.style.opacity = '0';
        setTimeout(() => {
          progressBar.style.transition = 'none';
          progressBar.style.width = '0%';
        }, 300);
      }, 700);

      // B. START SEQUENTIAL SVG DISPLAYS AT THE EXACT SAME TIME
      if (svgOverlay1) {
        svgOverlay1.classList.add('active');

        // First SVG random duration
        const duration1 = Math.floor(Math.random() * 30) + 60;
        
        setTimeout(() => {
          svgOverlay1.classList.remove('active');

          if (svgOverlay2) {
            // Force 0s initial transition & full opacity
            svgOverlay2.style.setProperty('transition', 'none', 'important');
            svgOverlay2.style.setProperty('opacity', '1', 'important');
            svgOverlay2.classList.add('active');

            // Second SVG random duration
            const duration2 = Math.floor(Math.random() * 200) + 400;

            setTimeout(() => {
              // FORCE 100ms fade-out with !important (overrides stylesheet)
              svgOverlay2.style.setProperty('transition', 'opacity 100ms linear', 'important');
              svgOverlay2.style.setProperty('opacity', '0', 'important');

              // Clean up 2nd SVG after exact 100ms
              setTimeout(() => {
                svgOverlay2.classList.remove('active');
                svgOverlay2.style.removeProperty('transition');
                svgOverlay2.style.removeProperty('opacity');
              }, 100);

              // 2. IMMEDIATELY start SVG 3
              if (svgOverlay3) {
                svgOverlay3.classList.add('active');

                // Third SVG random duration
                const duration3 = Math.floor(Math.random() * 500) + 800;

                setTimeout(() => {
                  svgOverlay3.classList.remove('active');

                  if (svgOverlay4) {
                    svgOverlay4.classList.add('active');

                    // Fourth SVG random duration
                    const duration4 = Math.floor(Math.random() * 501) + 1000;

                    setTimeout(() => {
                      svgOverlay4.classList.remove('active');
                    }, duration4);
                  }
                }, duration3);
              }
            }, duration2);
          }
        }, duration1);
      }

    }, randomPauseDuration);
  });
}

      function handleDragEnd() {
        if (!isDragging) return;
        isDragging = false;

        const dampedHeaderPull = MAX_HEADER_PULL * (1 - Math.exp(-currentDeltaY / RESISTANCE));

        if (dampedHeaderPull >= TRIGGER_THRESHOLD) {
          // Read current scale directly from computed style so keyframes expand smoothly from that scale
          const currentComputedTransform = window.getComputedStyle(reloadCircleBg).transform;
          let currentScale = 1;

          if (currentComputedTransform && currentComputedTransform !== 'none') {
            const matrixValues = currentComputedTransform.match(/matrix\((.+)\)/);
            if (matrixValues) {
              const parts = matrixValues[1].split(',');
              currentScale = parseFloat(parts[0]) || 1;
            }
          }

          releaseExpandCircle.style.setProperty('--start-scale', currentScale);
          releaseExpandCircle.classList.add('animating');
          triggerProgressBarAnimation();
        }

        requestAnimationFrame(() => {
          const transitionStyle = `transform ${RELEASE_DURATION}s cubic-bezier(0.25, 1, 0.5, 1), opacity ${RELEASE_DURATION * 0.7}s ease`;
          animatedElements.forEach(el => el.style.transition = transitionStyle);

          viewport.style.transform = `translate3d(0, 0px, 0)`;
          header.style.transform = `translate3d(0, 0px, 0)`;
          header.style.opacity = '1';

          leftIcon.style.transform = `translate3d(-80px, 0px, 0) scale(1)`;
          leftIcon.style.opacity = '0';

          centerIcon.style.transform = `translate3d(0, 0px, 0) scale(0.6)`;
          centerIcon.style.opacity = '0';
          centerIcon.style.color = '#e3e2e1';

          rightIcon.style.transform = `translate3d(80px, 0px, 0) scale(1)`;
          rightIcon.style.opacity = '0';

          reloadCircleBg.style.opacity = '0';
          reloadCircleBg.style.transform = `scale(0)`;
          reloadLabelText.classList.remove('visible');
        });

        currentDeltaY = 0;
      }

      header.addEventListener('mousedown', handleDragStart);
      window.addEventListener('mousemove', handleDragMove);
      window.addEventListener('mouseup', handleDragEnd);

      header.addEventListener('touchstart', handleDragStart, { passive: true });
      window.addEventListener('touchmove', handleDragMove, { passive: false });
      window.addEventListener('touchend', handleDragEnd);
    });
  </script>
